<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="71.12mm" height="128.5mm" viewBox="0 0 71.12 128.5">
	<!--
	Deliberately no <text> elements: VCV Rack renders panel SVGs via NanoSVG,
	which does not render <text> as real glyphs (the standard workaround is
	converting text to vector paths in Inkscape, or — as done here — drawing
	labels at runtime via NanoVG in the ModuleWidget's draw() override, which
	fully supports text and doesn't depend on any SVG-authoring tool).
	All label positions/colors below are kept in sync with VisionCV.cpp's
	`layout` namespace constants.
	-->
	<rect x="0" y="0" width="71.12" height="128.5" fill="#1a1b1f"/>
	<rect x="0.6" y="0.6" width="69.92" height="127.3" fill="none" stroke="#3a3c42" stroke-width="0.4"/>
	<!-- Divider between controls and I/O — keep in sync with DIVIDER_Y in VisionCV.cpp -->
	<line x1="4" y1="89" x2="67.12" y2="89" stroke="#3a3c42" stroke-width="0.3"/>
</svg>
